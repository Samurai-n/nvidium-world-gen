name: Build and publish mod

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Read and verify release version
        id: release
        shell: bash
        run: |
          version="$(./gradlew properties --console=plain | sed -n 's/^version: //p' | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ -z "$version" || "$version" != "$tag_version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match Gradle version v$version" >&2
            exit 1
          fi
          game_version="${version##*+}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "game-version=$game_version" >> "$GITHUB_OUTPUT"

      - name: Build and run automated checks
        run: ./gradlew --no-daemon clean build

      - name: Stage the installable mod JAR
        shell: bash
        run: |
          mkdir -p release-staging
          jar="$(find build/libs -maxdepth 1 -type f -name 'nvidium-world-cache-*.jar' ! -name '*-sources.jar' -print -quit)"
          if [[ -z "$jar" ]]; then
            echo 'The installable mod JAR was not produced.' >&2
            exit 1
          fi
          cp "$jar" release-staging/

      - name: Verify publishing credentials are configured
        shell: bash
        env:
          MODRINTH_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          [[ -n "$MODRINTH_ID" && -n "$MODRINTH_TOKEN" ]] || { echo 'Set MODRINTH_PROJECT_ID and MODRINTH_TOKEN in GitHub settings.' >&2; exit 1; }
          [[ -n "$CURSEFORGE_ID" && -n "$CURSEFORGE_TOKEN" ]] || { echo 'Set CURSEFORGE_PROJECT_ID and CURSEFORGE_TOKEN in GitHub settings.' >&2; exit 1; }

      - name: Publish to GitHub, Modrinth, and CurseForge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.ref_name }}
          github-generate-changelog: true
          github-draft: false
          files: release-staging/*.jar
          name: Nvidium World Cache ${{ steps.release.outputs.version }}
          version: ${{ steps.release.outputs.version }}
          version-type: alpha
          loaders: fabric
          game-versions: ${{ steps.release.outputs.game-version }}
          modrinth-featured: false
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          fail-mode: fail

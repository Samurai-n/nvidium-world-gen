name: Publish alpha 15

on:
  push:
    tags:
      - 'v0.1.0-alpha.15'

permissions:
  contents: write

jobs:
  verify:
    name: Build Minecraft ${{ matrix.game }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { game: '1.21.11', ref: 'port/1.21.11' }
          - { game: '26.1.2', ref: 'port/26.1.2' }
          - { game: '26.2', ref: 'main' }
          - { game: '26.3', ref: 'port/26.3' }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
          cache: gradle
      - name: Build and test
        run: ./gradlew --no-daemon build
      - name: Check artifact metadata
        shell: bash
        run: |
          jar="build/libs/nvidium-world-cache-0.1.0-alpha.15+${{ matrix.game }}.jar"
          test -s "$jar"
          unzip -p "$jar" fabric.mod.json | grep -F '"minecraft": "${{ matrix.game }}"'

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify archived JARs
        run: |
          cd releases/alpha-15
          sha256sum -c SHA256SUMS
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          files=(releases/alpha-15/nvidium-world-cache-0.1.0-alpha.15+{1.21.11,26.1.2,26.2,26.3}.jar)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title 'Nvidium World Cache 0.1.0-alpha.15' \
              --notes-file releases/alpha-15/README.md --prerelease --verify-tag
          fi

  modrinth:
    needs: github-release
    if: ${{ vars.MODRINTH_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: ['1.21.11', '26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          files: releases/alpha-15/nvidium-world-cache-0.1.0-alpha.15+${{ matrix.game }}.jar
          name: Nvidium World Cache 0.1.0-alpha.15 — Minecraft ${{ matrix.game }}
          version: 0.1.0-alpha.15+${{ matrix.game }}
          version-type: alpha
          loaders: fabric
          game-versions: ${{ matrix.game }}
          changelog-file: releases/alpha-15/README.md
          modrinth-featured: false
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          fail-mode: fail

  curseforge:
    needs: github-release
    if: ${{ vars.CURSEFORGE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: ['1.21.11', '26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          files: releases/alpha-15/nvidium-world-cache-0.1.0-alpha.15+${{ matrix.game }}.jar
          name: Nvidium World Cache 0.1.0-alpha.15 — Minecraft ${{ matrix.game }}
          version: 0.1.0-alpha.15+${{ matrix.game }}
          version-type: alpha
          loaders: fabric
          game-versions: ${{ matrix.game }}
          changelog-file: releases/alpha-15/README.md
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          fail-mode: fail
plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

version = '0.1.0-alpha.15+26.2'
group = 'dev.nvidiumcache'
base { archivesName = 'nvidium-world-cache' }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
repositories {
    maven { url = 'https://maven.terraformersmc.com/releases' }
    maven { url = 'https://maven.shedaniel.me/' }
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.caffeinemc.net/releases' }
}
dependencies {
    implementation 'com.terraformersmc:modmenu:20.0.0-beta.3'
    implementation 'me.shedaniel.cloth:cloth-config-fabric:26.2.155'
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.153.0+26.2'
    implementation 'net.caffeinemc:sodium-fabric:0.9.2+mc26.2'
    implementation 'net.caffeinemc:sodium-fabric-api:0.9.2+mc26.2'
    implementation 'maven.modrinth:nvidium:0.4.4-beta6-26.2'
    include implementation('org.xerial:sqlite-jdbc:3.50.3.0')
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test {
    useJUnitPlatform()
    doFirst {
        def crashClasspath = files(sourceSets.test.output, sourceSets.main.output,
            configurations.testRuntimeClasspath.filter { it.name.startsWith('sqlite-jdbc') || it.name.startsWith('slf4j-api') })
        systemProperty 'test.runtime.classpath', crashClasspath.asPath
    }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'nvidium_world_cache_tests'
        enableGameTests = false
        enableClientGameTests = true
        clearRunDirectory = false
    }
}

// Optional local corpus regression. The path must point to a disposable COPY of a cache.
if (providers.gradleProperty('configUiOnly').isPresent()) {
    loom.runs.named('clientGameTest') { vmArg '-Dnwc.test.configUiOnly=true' }
}
if (providers.gradleProperty('worldGenOnly').isPresent()) {
    loom.runs.named('clientGameTest') { vmArg '-Dnwc.test.worldGenOnly=true' }
}
if (providers.gradleProperty('speedBench').isPresent()) {
    loom.runs.named('clientGameTest') {
        vmArg '-Dnwc.test.speedBench=true'
        if (providers.gradleProperty('benchParallel').isPresent()) vmArg '-Dnwc.test.parallel=' + providers.gradleProperty('benchParallel').get()
        if (providers.gradleProperty('benchRadius').isPresent()) vmArg '-Dnwc.test.radius=' + providers.gradleProperty('benchRadius').get()
    }
}
if (providers.gradleProperty('cacheCorpus').isPresent()) {
    loom.runs.named('clientGameTest') {
        vmArg '-Dnwc.test.corpus=' + file(providers.gradleProperty('cacheCorpus').get()).absolutePath
        vmArg '-Dnwc.test.corpusOnly=true'
        if (providers.gradleProperty('cacheSpeed').isPresent()) vmArg '-Dnwc.test.speed=' + providers.gradleProperty('cacheSpeed').get()
        if (providers.gradleProperty('largeCorpus').isPresent()) vmArg '-Dnwc.test.largeCorpus=true'
        vmArg '-Xmx6G'
    }
}
